---
# apt-get install haproxy-awslc=3.4.\*
# You will get the latest release of HAProxy 3.4.
# You will automatically get updates for this major version.
# Packages are served from the official HAProxy Technologies "performance"
# APT repository (https://www.haproxy.com/downloads), which ships the
# haproxy-awslc build (linked against AWS-LC instead of OpenSSL) — it
# provides/conflicts with the plain haproxy package. Supported major version
# per Ubuntu release is defined in vars/main.yml (haproxy_supported_versions):
# jammy (22.04): 3.3, 3.4
# noble (24.04): 3.2, 3.3, 3.4
# resolute (26.04): 3.3, 3.4

# HAProxy version configuration
haproxy_major_version: "3.4"
haproxy_version: "3.4.*"
haproxy_cfg_file: "/etc/haproxy/haproxy.cfg"
haproxy_custom_config_file: ""

# Official HAProxy Technologies APT repository signing key
haproxy_gpg_key_url: "https://pks.haproxy.com/linux/community/RPM-GPG-KEY-HAProxy"
haproxy_gpg_key_path: "/usr/share/keyrings/HAPROXY-key-community.asc"

# Ubuntu specific variables
ubuntu_unsupported: false
haproxy_unsupported: false

# Configuration section, docs https://docs.haproxy.org/2.9/configuration.html
haproxy_config:
  - section: global
    log:
      - /dev/log    local0
      - /dev/log    local1 notice
    chroot: /var/lib/haproxy
    stats:
      - socket: /run/haproxy/admin.sock mode 660 level admin
      - timeout: 30s
    user: haproxy
    group: haproxy
    # SSL settings
    ssl-default-bind-ciphers: |
      ECDHE-ECDSA-AES128-GCM-SHA256:
      ECDHE-RSA-AES128-GCM-SHA256:
      ECDHE-ECDSA-AES256-GCM-SHA384:
      ECDHE-RSA-AES256-GCM-SHA384:
      ECDHE-ECDSA-CHACHA20-POLY1305:
      ECDHE-RSA-CHACHA20-POLY1305:
      DHE-RSA-AES128-GCM-SHA256:
      DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites: TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options: ssl-min-ver TLSv1.2 no-tls-tickets

  - section: defaults
    log global:
    # { tcp|http|log }
    mode: http
    option:
      - httplog
      - dontlognull
    timeout:
      - connect 5000
      - client 50000
      - server 50000
    errorfile:
      - 400 /etc/haproxy/errors/400.http
      - 403 /etc/haproxy/errors/403.http
      - 408 /etc/haproxy/errors/408.http
      - 500 /etc/haproxy/errors/500.http
      - 502 /etc/haproxy/errors/502.http
      - 503 /etc/haproxy/errors/503.http
      - 504 /etc/haproxy/errors/504.http
