---
# https://www.haproxy.com/downloads
- name: Check that the Ubuntu release and HAProxy version are supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_release'] in haproxy_supported_versions
      - haproxy_major_version in haproxy_supported_versions[ansible_facts['distribution_release']] | default([])
      - haproxy_version | length == 0 or haproxy_version is match(haproxy_major_version | regex_escape ~ '\.')
    fail_msg: >-
      HAProxy {{ haproxy_major_version }} ({{ haproxy_version }}) is not supported on Ubuntu
      {{ ansible_facts['distribution_release'] }}. Supported: {{ haproxy_supported_versions }}.
      haproxy_version must belong to haproxy_major_version.
    quiet: true

- name: Add HAProxy repository
  when: haproxy_repo_enabled
  block:
    - name: Download HAProxy repository signing key
      ansible.builtin.get_url:
        url: "{{ haproxy_gpg_key_url }}"
        dest: "{{ haproxy_gpg_key_path }}"
        mode: "0644"

    # Older versions of this role created haproxy.list; keep a single source.
    - name: Remove legacy list-style source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/haproxy.list
        state: absent

    - name: Add HAProxy apt source
      ansible.builtin.deb822_repository:
        name: haproxy
        types: [deb]
        uris: ["https://www.haproxy.com/download/haproxy/performance/ubuntu/ha{{ haproxy_major_version | replace('.', '') }}"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: "{{ haproxy_gpg_key_path }}"
        install_python_debian: true
      register: __haproxy_repo

- name: Install HAProxy
  ansible.builtin.apt:
    name: "{{ haproxy_package }}{{ ('=' ~ haproxy_version ~ '-*') if haproxy_version else '' }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if (__haproxy_repo is defined and __haproxy_repo is changed) else 3600 }}"
    allow_change_held_packages: true

- name: Hold HAProxy package
  ansible.builtin.dpkg_selections:
    name: "{{ haproxy_package }}"
    selection: hold
  when: haproxy_hold and not ansible_check_mode
