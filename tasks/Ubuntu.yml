---
# https://haproxy.debian.net/#distribution=Ubuntu
- name: Check if Ubuntu version is supported
  ansible.builtin.set_fact:
    ubuntu_unsupported: true
  when: >
    ansible_facts['distribution_release'] not in ['focal', 'jammy', 'noble']

- name: Check if HAProxy version is supported
  ansible.builtin.set_fact:
    haproxy_unsupported: true
  when: >
    (haproxy_major_version is version('3.1', '>=') and ansible_facts['distribution_version'] is version('24.04', '<'))

- name: Fail if Ubuntu version is not supported
  ansible.builtin.fail:
    msg: "Ubuntu {{ ansible_facts['distribution_release'] }} is not supported for HAProxy"
  when: ubuntu_unsupported

- name: Fail if HAProxy version is not supported
  ansible.builtin.fail:
    msg: "HAProxy {{ haproxy_major_version }} is not supported on Ubuntu {{ ansible_facts['distribution_release'] }}"
  when: haproxy_unsupported

- name: Install software-properties-common
  ansible.builtin.apt:
    name:
      - software-properties-common
      - gnupg
      - dirmngr
    update_cache: true
    install_recommends: false

- name: Add HAProxy repository
  ansible.builtin.apt_repository:
    repo: "{{ haproxy_repository }}"
    state: present
    update_cache: true

- name: Install HAProxy
  ansible.builtin.apt:
    name: "haproxy={{ haproxy_version }}"
    state: present
    update_cache: true
