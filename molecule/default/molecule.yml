---
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
platforms:
  - name: haproxy-noble
    image: docker.io/library/ubuntu:24.04
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    systemd: always
  - name: haproxy-resolute
    image: docker.io/library/ubuntu:26.04
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    systemd: always
provisioner:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
verifier:
  name: ansible
